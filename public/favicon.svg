<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Tanfield Lea Community Centre icon</title>
  <desc id="desc">Circular crest with TL initials</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f5f8b" />
      <stop offset="100%" stop-color="#2b8c6b" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <circle cx="32" cy="32" r="24" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2.5" />
  <text x="32" y="39" text-anchor="middle" fill="#ffffff" font-size="24" font-family="Georgia, 'Times New Roman', serif" font-weight="700">TL</text>
</svg>
